# Scorer is GCP n2 (Intel Cascade Lake or newer): AVX2/BMI2/FMA/AES-NI/PCLMULQDQ
# (CONTEXT.md §4). x86-64-v3, not v4: avoid AVX-512 frequency licensing on Cascade Lake.
# Target-scoped, so arm64 (Mac) builds are unaffected.
# NOTE: a RUSTFLAGS env var REPLACES this list entirely; never set RUSTFLAGS in a build
# that should carry these flags.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+aes,+pclmulqdq"]
